name: Version stamp

on:
  push:
    branches: [main]

jobs:
  stamp:
    runs-on: ubuntu-latest
    # Skip commits made by the Action itself to prevent infinite loops
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute version string
        id: ver
        run: |
          SHORT="${GITHUB_SHA:0:8}"
          DATE=$(date -u '+%Y-%m-%d')
          TIME=$(date -u '+%H:%M')
          echo "str=Prototype ${SHORT} ${DATE}·UTC${TIME}" >> "$GITHUB_OUTPUT"

      - name: Stamp all HTML files
        env:
          VER: ${{ steps.ver.outputs.str }}
        run: |
          python3 << 'PYEOF'
          import re, glob, os
          ver = os.environ['VER']
          pat = re.compile(
              r'Prototype\s+[a-f0-9]{8}\s+\d{4}-\d{2}-\d{2}\xb7UTC\d{2}:\d{2}'
          )
          for fpath in sorted(glob.glob('*.html')):
              text = open(fpath, encoding='utf-8').read()
              new  = pat.sub(ver, text)
              if new != text:
                  open(fpath, 'w', encoding='utf-8').write(new)
                  print(f'Stamped {fpath}')
              else:
                  print(f'No match in {fpath}')
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html
          if git diff --staged --quiet; then
            echo "Nothing to stamp."
          else
            git commit -m "chore: version stamp ${GITHUB_SHA:0:8} $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
