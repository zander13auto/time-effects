<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>52-Week Life Grid · 02026–02035</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #101517; }

/* ── Design tokens ─────────────────────────────────────────────── */
:root {
  --ac: #e8c08c;
  --bl: #3858E9;
  --sf: 'Recoleta','Cormorant Garamond','Times New Roman',serif;
  --ss: 'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif;
  --bg: #101517;
  --bg2: #0a0d0f;
  --bd: rgba(232,192,140,.18);
}

/* ── Page ───────────────────────────────────────────────────────── */
.root {
  background: var(--bg);
  color: #fff;
  font-family: var(--ss);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding: 64px 32px 96px;
}
.wrap { max-width: 1280px; margin: 0 auto; }

/* ── Header type ────────────────────────────────────────────────── */
.eyebrow {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ac);
  margin-bottom: 24px;
}
.title {
  font-family: var(--sf);
  font-weight: 400;
  letter-spacing: -.02em;
  line-height: 1.05;
  font-size: clamp(40px, 6vw, 72px);
  color: #fff;
  margin: 0 0 16px;
}
.title em { font-style: italic; color: var(--ac); font-weight: 300; }
.lead {
  font-size: 17px;
  color: #dcdcde;
  max-width: 680px;
  margin: 0 0 40px;
  line-height: 1.6;
}

/* ── Meta strip ─────────────────────────────────────────────────── */
.meta {
  display: flex;
  gap: 32px;
  flex-wrap: wrap;
  margin-bottom: 40px;
  padding: 20px 24px;
  background: rgba(232,192,140,.04);
  border: 1px solid var(--bd);
  border-radius: 8px;
}
.meta-item { display: flex; flex-direction: column; gap: 4px; }
.meta-item .k {
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ac);
  font-weight: 600;
}
.meta-item .v {
  font-family: var(--sf);
  font-size: 22px;
  color: #fff;
  font-feature-settings: 'tnum';
}
.meta-item .v small {
  font-size: 13px;
  color: #a7aaad;
  font-family: var(--ss);
  margin-left: 6px;
}

/* ── Grid container ─────────────────────────────────────────────── */
.container {
  background: var(--bg2);
  border: 1px solid rgba(232,192,140,.25);
  border-radius: 6px;
  padding: 36px 24px 24px 64px;
  position: relative;
}
.axis-x {
  position: absolute;
  top: 14px; left: 64px; right: 24px;
  display: grid;
  grid-template-columns: repeat(52, 1fr);
  font-size: 10px;
  color: rgba(232,192,140,.7);
  letter-spacing: .06em;
  font-feature-settings: 'tnum';
  font-weight: 600;
  text-align: center;
}
.axis-y {
  position: absolute;
  top: 36px; left: 8px; bottom: 24px;
  width: 50px;
  display: grid;
  grid-template-rows: repeat(10, 1fr);
  font-size: 10px;
  color: rgba(232,192,140,.7);
  letter-spacing: .06em;
  font-feature-settings: 'tnum';
  font-weight: 600;
  text-align: right;
  padding-right: 10px;
  align-items: center;
}
.grid {
  display: grid;
  grid-template-columns: repeat(52, 1fr);
  gap: 2px;
  background: rgba(232,192,140,.18);
  padding: 2px;
  border-radius: 3px;
}

/* ── Cell ───────────────────────────────────────────────────────────
   <a> stays at native size for correct pointer hit-detection.
   All visual scaling lives in ::before (pointer-events: none).
   transform-origin: 50% 100% → tile grows upward from bottom edge.
──────────────────────────────────────────────────────────────────── */
.c {
  aspect-ratio: 1/1;
  text-decoration: none;
  color: transparent;
  position: relative;
  font-size: 0;
  line-height: 1;
  overflow: visible;
}
.c::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  transform-origin: 50% 100%;
  background: #1d2327;
  border: 1px solid rgba(232,192,140,.1);
  transition:
    transform .18s cubic-bezier(.22,.61,.36,1),
    background .15s ease,
    border-color .15s ease,
    box-shadow .15s ease,
    border-radius .15s ease;
}

/* Note states */
.c.has-note::before          { background: rgba(232,192,140,.5); border-color: rgba(232,192,140,.8); }
.c.has-note.has-link::before { background: var(--ac); }
.c.is-today::before          { outline: 2px solid var(--bl); outline-offset: -1px; }

/* Hover — center cell */
.c:hover { z-index: 9; }
.c:hover::before {
  transform: scale(6);
  background: var(--ac);
  border-color: var(--ac);
  border-radius: 5px;
  box-shadow: 0 0 0 1px var(--ac), 0 12px 36px rgba(0,0,0,.8);
}

/* Fisheye neighbours ±1 */
.c:hover + .c,
.c:has(+ .c:hover) { z-index: 7; }
.c:hover + .c::before,
.c:has(+ .c:hover)::before {
  transform: scale(3.6);
  background: rgba(232,192,140,.75);
  border-color: rgba(232,192,140,.85);
  box-shadow: 0 6px 20px rgba(0,0,0,.55);
}

/* ±2 */
.c:hover + .c + .c,
.c:has(+ .c + .c:hover) { z-index: 5; }
.c:hover + .c + .c::before,
.c:has(+ .c + .c:hover)::before {
  transform: scale(2.2);
  background: rgba(232,192,140,.45);
}

/* ±3 */
.c:hover + .c + .c + .c,
.c:has(+ .c + .c + .c:hover) { z-index: 3; }
.c:hover + .c + .c + .c::before,
.c:has(+ .c + .c + .c:hover)::before {
  transform: scale(1.45);
  background: rgba(232,192,140,.22);
}

/* ── Lens overlay ───────────────────────────────────────────────────
   JS positions this at the actual visual coordinates of the 6× tile.
   No CSS transform — already at real size. RAF loop tracks :hover.
──────────────────────────────────────────────────────────────────── */
.lens {
  position: absolute;
  pointer-events: none;
  z-index: 25;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 12% 8% 10%;
  opacity: 0;
  transition: opacity .12s ease;
}
.lens.on { opacity: 1; }
.lens-title {
  font-family: var(--sf);
  font-size: 14px;
  font-weight: 600;
  color: #101517;
  text-align: center;
  line-height: 1.25;
  pointer-events: none;
  white-space: nowrap;
}
.lens-add {
  font-family: var(--ss);
  font-size: 10px;
  color: rgba(16,21,23,.5);
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: underline;
  padding: 2px 4px;
  pointer-events: all;
  white-space: nowrap;
  line-height: 1;
}
.lens-add:hover { color: #101517; }

/* ── Modal ──────────────────────────────────────────────────────── */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.72);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: #1a1f23;
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 32px;
  width: 440px;
  max-width: calc(100vw - 48px);
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 20px;
}
.modal-wk {
  font-family: var(--sf);
  font-size: 20px;
  color: var(--ac);
  font-weight: 400;
  line-height: 1.2;
}
.modal-close {
  background: none;
  border: none;
  color: #5a6370;
  font-size: 22px;
  cursor: pointer;
  padding: 0;
  line-height: 1;
  margin-top: -2px;
}
.modal-close:hover { color: #fff; }
.modal-lbl {
  display: block;
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: rgba(232,192,140,.65);
  font-weight: 600;
  margin-bottom: 7px;
}
.modal-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 6px;
  color: #dcdcde;
  font-family: var(--ss);
  padding: 11px 14px;
  outline: none;
  margin-bottom: 14px;
}
.modal-input:focus { border-color: rgba(232,192,140,.45); }
textarea.modal-input { font-size: 15px; line-height: 1.6; resize: vertical; min-height: 96px; }
input.modal-input    { font-size: 14px; margin-bottom: 24px; }
.modal-input::placeholder { color: #384048; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
.btn-cancel {
  background: transparent;
  border: 1px solid rgba(232,192,140,.2);
  color: #7a8390;
  padding: 9px 18px;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  font-family: var(--ss);
}
.btn-cancel:hover { border-color: rgba(232,192,140,.45); color: #fff; }
.btn-save {
  background: var(--ac);
  border: none;
  color: var(--bg);
  padding: 9px 20px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--ss);
}
.btn-save:hover { background: #f0cfa0; }

/* ── Footer ─────────────────────────────────────────────────────── */
.footer {
  background: #000;
  padding: 32px;
  text-align: center;
  font-size: 12px;
  color: #a7aaad;
  letter-spacing: .06em;
  margin: 64px -32px -96px;
}
.footer a { color: var(--ac); text-decoration: none; }
</style>
</head>
<body>
<div class="root"><div class="wrap">

<span class="eyebrow">Prototype v20260607·1543 · 52 × 10 · Fisheye hover · JS notes</span>
<h1 class="title">A decade, <em>one week at a time.</em></h1>
<p class="lead">520 cells spanning one decade. Hover any cell to magnify — neighboring cells scale with a fisheye effect. Click "add a note" on any week to annotate it.</p>

<div class="meta">
  <div class="meta-item"><span class="k">Span</span><span class="v">02026<small>–</small>02035</span></div>
  <div class="meta-item"><span class="k">Weeks</span><span class="v">520</span></div>
  <div class="meta-item"><span class="k">Notes stored</span><span class="v" id="noteCount">0<small>localStorage</small></span></div>
</div>

<div class="container" id="container">
  <div class="axis-x" id="axisX"></div>
  <div class="axis-y" id="axisY"></div>
  <div class="grid"   id="grid"></div>
</div>

</div></div>

<!-- Note modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-wk" id="modalWk"></span>
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    </div>
    <label class="modal-lbl" for="modalText">Note</label>
    <textarea class="modal-input" id="modalText" placeholder="What happened this week?"></textarea>
    <label class="modal-lbl" for="modalUrl">Link (optional)</label>
    <input  class="modal-input" id="modalUrl" type="url" placeholder="https://...">
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">Cancel</button>
      <button class="btn-save"   id="modalSave">Save note</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── Config ─────────────────────────────────────────────────────
  const YEARS      = 10;
  const WEEKS      = 52;
  const START_YEAR = 2026;
  const STORE      = 'lg-notes-v1';
  const SCALE      = 6;

  // Today's ISO week — marks the current cell with .is-today
  function isoWeekYear(d) {
    const tmp = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    tmp.setUTCDate(tmp.getUTCDate() + 4 - (tmp.getUTCDay() || 7));
    const y   = tmp.getUTCFullYear();
    const w   = Math.ceil(((tmp - new Date(Date.UTC(y, 0, 1))) / 86400000 + 1) / 7);
    return { week: w, year: y };
  }
  const today = isoWeekYear(new Date());

  // ── Build axis labels ───────────────────────────────────────────
  const axisX = document.getElementById('axisX');
  for (let w = 1; w <= WEEKS; w++) {
    const span = document.createElement('span');
    span.textContent = (w === 1 || w % 5 === 0 || w === WEEKS) ? w : '';
    axisX.appendChild(span);
  }

  const axisY = document.getElementById('axisY');
  for (let y = 0; y < YEARS; y++) {
    const span = document.createElement('span');
    span.textContent = '0' + (START_YEAR + y);
    axisY.appendChild(span);
  }

  // ── Build grid cells ────────────────────────────────────────────
  const grid = document.getElementById('grid');
  for (let y = 0; y < YEARS; y++) {
    const year = START_YEAR + y;
    for (let w = 1; w <= WEEKS; w++) {
      const a = document.createElement('a');
      a.className  = 'c';
      a.dataset.d  = `Week ${w}, 0${year}`;
      a.dataset.w  = w;
      a.dataset.y  = year;
      if (w === today.week && year === today.year) a.classList.add('is-today');
      grid.appendChild(a);
    }
  }

  // ── localStorage helpers ────────────────────────────────────────
  function loadNotes() {
    try { return JSON.parse(localStorage.getItem(STORE)) || {}; }
    catch { return {}; }
  }
  function saveNotes(n) { localStorage.setItem(STORE, JSON.stringify(n)); }

  function applyNoteClasses(notes) {
    document.querySelectorAll('.c').forEach(cell => {
      const n = notes[cell.dataset.d];
      cell.classList.toggle('has-note', !!n);
      cell.classList.toggle('has-link', !!(n && n.url));
    });
  }

  function updateCount(notes) {
    const el = document.getElementById('noteCount');
    if (el) el.childNodes[0].textContent = Object.keys(notes).length;
  }

  // ── Lens overlay ────────────────────────────────────────────────
  const container = document.getElementById('container');
  const lens      = document.createElement('div');
  lens.className  = 'lens';
  lens.innerHTML  = '<span class="lens-title"></span><button class="lens-add"></button>';
  container.appendChild(lens);

  const lensTitle = lens.querySelector('.lens-title');
  const lensAdd   = lens.querySelector('.lens-add');

  let prevKey     = null;
  let modalIsOpen = false;
  let mouseX = 0, mouseY = 0;
  document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

  // Returns true if the mouse is currently inside the visible lens div.
  // Used to keep the lens alive while the cursor travels from the tiny
  // native cell (bottom of the magnified area) up to the title/button.
  function mouseInLens() {
    if (!lens.classList.contains('on')) return false;
    const r = lens.getBoundingClientRect();
    return mouseX >= r.left && mouseX <= r.right &&
           mouseY >= r.top  && mouseY <= r.bottom;
  }

  // RAF loop: grid.querySelector('.c:hover') always resolves to the
  // native-size <a> element (::before has pointer-events:none), so
  // hover detection is pixel-accurate even under the scaled tile.
  function tick() {
    if (!modalIsOpen) {
      const hov = grid.querySelector('.c:hover');
      if (hov) {
        const key = hov.dataset.d;
        if (key !== prevKey) {
          prevKey = key;
          const notes  = loadNotes();
          const cRect  = container.getBoundingClientRect();
          const hRect  = hov.getBoundingClientRect();
          const w = hRect.width  * SCALE;
          const h = hRect.height * SCALE;
          lens.style.left   = ((hRect.left - cRect.left) + hRect.width  / 2 - w / 2) + 'px';
          lens.style.top    = ((hRect.top  - cRect.top)  + hRect.height - h)          + 'px';
          lens.style.width  = w + 'px';
          lens.style.height = h + 'px';
          lensTitle.textContent = key;
          lensAdd.textContent   = notes[key] ? 'edit note' : '+ add a note';
          lensAdd.dataset.key   = key;
          lens.classList.add('on');
        }
      } else if (prevKey !== null && !mouseInLens()) {
        // Only hide if the cursor has also left the lens bounds —
        // prevents the lens from vanishing mid-travel to the button.
        lens.classList.remove('on');
        prevKey = null;
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ── Modal ───────────────────────────────────────────────────────
  const modalBg     = document.getElementById('modalBg');
  const modalWk     = document.getElementById('modalWk');
  const modalText   = document.getElementById('modalText');
  const modalUrl    = document.getElementById('modalUrl');
  const modalClose  = document.getElementById('modalClose');
  const modalCancel = document.getElementById('modalCancel');
  const modalSave   = document.getElementById('modalSave');
  let   modalKey    = null;

  function openModal(key) {
    const notes    = loadNotes();
    const existing = notes[key] || {};
    modalKey            = key;
    modalWk.textContent = key;
    modalText.value     = existing.text || '';
    modalUrl.value      = existing.url  || '';
    modalIsOpen = true;
    lens.classList.remove('on');
    prevKey = null;
    modalBg.classList.add('open');
    setTimeout(() => modalText.focus(), 50);
  }

  function closeModal() {
    modalBg.classList.remove('open');
    modalKey    = null;
    modalIsOpen = false;
  }

  function saveNote() {
    if (!modalKey) return;
    const text  = modalText.value.trim();
    const url   = modalUrl.value.trim();
    const notes = loadNotes();
    if (text || url) { notes[modalKey] = { text, url }; }
    else             { delete notes[modalKey]; }
    saveNotes(notes);
    applyNoteClasses(notes);
    updateCount(notes);
    closeModal();
  }

  lensAdd.addEventListener('click',   () => { if (lensAdd.dataset.key) openModal(lensAdd.dataset.key); });
  modalClose.addEventListener('click',  closeModal);
  modalCancel.addEventListener('click', closeModal);
  modalSave.addEventListener('click',   saveNote);
  modalBg.addEventListener('click', e => { if (e.target === modalBg) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── Init ────────────────────────────────────────────────────────
  const notes = loadNotes();
  applyNoteClasses(notes);
  updateCount(notes);
})();
</script>
</body>
</html>
