<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>52-Week Life Grid · 02026–02035</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #101517; }

:root {
  --ac: #e8c08c;
  --bl: #3858E9;
  --sf: 'Recoleta','Cormorant Garamond','Times New Roman',serif;
  --ss: 'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif;
  --bg: #101517;
  --bg2: #0a0d0f;
  --bd: rgba(232,192,140,.18);
}

.root { background: var(--bg); color: #fff; font-family: var(--ss); -webkit-font-smoothing: antialiased; min-height: 100vh; padding: 64px 32px 96px; }
.wrap { max-width: 1280px; margin: 0 auto; }

.eyebrow { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--ac); margin-bottom: 24px; }
.title { font-family: var(--sf); font-weight: 400; letter-spacing: -.02em; line-height: 1.05; font-size: clamp(40px,6vw,72px); color: #fff; margin: 0 0 16px; }
.title em { font-style: italic; color: var(--ac); font-weight: 300; }
.lead { font-size: 17px; color: #dcdcde; max-width: 680px; margin: 0 0 40px; line-height: 1.6; }

.meta { display: flex; gap: 32px; flex-wrap: wrap; margin-bottom: 40px; padding: 20px 24px; background: rgba(232,192,140,.04); border: 1px solid var(--bd); border-radius: 8px; }
.meta-item { display: flex; flex-direction: column; gap: 4px; }
.meta-item .k { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ac); font-weight: 600; }
.meta-item .v { font-family: var(--sf); font-size: 22px; color: #fff; font-feature-settings: 'tnum'; }
.meta-item .v small { font-size: 13px; color: #a7aaad; font-family: var(--ss); margin-left: 6px; }

.container { background: var(--bg2); border: 1px solid rgba(232,192,140,.25); border-radius: 6px; padding: 36px 24px 24px 64px; position: relative; }
.axis-x { position: absolute; top: 14px; left: 64px; right: 24px; display: grid; grid-template-columns: repeat(52,1fr); font-size: 10px; color: rgba(232,192,140,.7); letter-spacing: .06em; font-feature-settings: 'tnum'; font-weight: 600; text-align: center; }
.axis-y { position: absolute; top: 36px; left: 8px; bottom: 24px; width: 50px; display: grid; grid-template-rows: repeat(10,1fr); font-size: 10px; color: rgba(232,192,140,.7); letter-spacing: .06em; font-feature-settings: 'tnum'; font-weight: 600; text-align: right; padding-right: 10px; align-items: center; }

/* Grid — one .row per year; sibling selectors stay within each row */
.grid { display: flex; flex-direction: column; background: rgba(232,192,140,.18); padding: 2px; border-radius: 3px; gap: 2px; }
.row  { display: grid; grid-template-columns: repeat(52,1fr); gap: 2px; }

/* ── Cell ─────────────────────────────────────────────────────────
   .c is the hit target (native size). All visuals live in ::before.
   pointer-events stays on the native-size element only.
──────────────────────────────────────────────────────────────────── */
.c {
  aspect-ratio: 1/1;
  text-decoration: none;
  color: transparent;
  position: relative;
  font-size: 0;
  line-height: 1;
  display: block;
  cursor: default;
}
.c::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  transform-origin: 50% 100%;
  background: #1d2327;
  border: 1px solid rgba(232,192,140,.1);
  transition:
    transform .18s cubic-bezier(.22,.61,.36,1),
    background .15s ease,
    border-color .15s ease,
    box-shadow .15s ease,
    border-radius .15s ease;
}

.c.has-note::before          { background: rgba(232,192,140,.5); border-color: rgba(232,192,140,.8); }
.c.has-note.has-link::before { background: var(--ac); }
.c.is-today::before          { outline: 2px solid var(--bl); outline-offset: -1px; }

/* Fisheye hover — visual only, contained within .row */
.c:hover               { z-index: 9; }
.c:hover::before {
  transform: scale(6);
  background: var(--ac);
  border-color: var(--ac);
  border-radius: 5px;
  box-shadow: 0 0 0 1px var(--ac), 0 12px 36px rgba(0,0,0,.8);
}
.c:hover + .c, .c:has(+ .c:hover)
  { z-index: 7; }
.c:hover + .c::before, .c:has(+ .c:hover)::before
  { transform: scale(3.6); background: rgba(232,192,140,.75); border-color: rgba(232,192,140,.85); box-shadow: 0 6px 20px rgba(0,0,0,.55); }
.c:hover + .c + .c, .c:has(+ .c + .c:hover)
  { z-index: 5; }
.c:hover + .c + .c::before, .c:has(+ .c + .c:hover)::before
  { transform: scale(2.2); background: rgba(232,192,140,.45); }
.c:hover + .c + .c + .c, .c:has(+ .c + .c + .c:hover)
  { z-index: 3; }
.c:hover + .c + .c + .c::before, .c:has(+ .c + .c + .c:hover)::before
  { transform: scale(1.45); background: rgba(232,192,140,.22); }

/* ── Floating lens ────────────────────────────────────────────────
   A single fixed-size panel that JS positions above the cursor.
   pointer-events:none on container so the cursor always lands on
   the native .c element beneath, giving smooth cell-by-cell tracking
   at any window size. Only btn and link have pointer-events:auto.
──────────────────────────────────────────────────────────────────── */
.lens {
  position: fixed;
  width: 168px;
  padding: 18px 16px 14px;
  background: var(--ac);
  border-radius: 9px;
  box-shadow: 0 2px 8px rgba(0,0,0,.25), 0 12px 36px rgba(0,0,0,.7);
  z-index: 100;
  display: none;
  pointer-events: none;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.lens.on { display: flex; }

.lens-head { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 100%; }
.lens-week { font-family: var(--sf); font-size: 18px; font-weight: 600; color: #101517; text-align: center; line-height: 1.15; }
.lens-year { font-family: var(--ss); font-size: 11px; color: rgba(16,21,23,.55); }

.lens-preview {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  width: 100%;
  border-top: 1px solid rgba(16,21,23,.12);
  padding-top: 7px;
}
.lens-preview.on { display: flex; }
.lens-note-txt {
  font-family: var(--ss);
  font-size: 10px;
  color: rgba(16,21,23,.75);
  text-align: center;
  width: 100%;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  line-height: 1.35;
}
.lens-link-txt {
  font-family: var(--ss);
  font-size: 10px;
  color: rgba(16,21,23,.55);
  text-decoration: underline;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
  pointer-events: auto;
  cursor: pointer;
}
.lens-link-txt:hover { color: #101517; }

.lens-btn {
  font-family: var(--ss);
  font-size: 10px;
  font-weight: 500;
  color: rgba(16,21,23,.6);
  background: rgba(16,21,23,.08);
  border: none;
  border-radius: 4px;
  cursor: pointer;
  padding: 4px 10px;
  white-space: nowrap;
  pointer-events: auto;
  margin-top: 2px;
}
.lens-btn:hover { background: rgba(16,21,23,.15); color: #101517; }

/* ── Modal ──────────────────────────────────────────────────────── */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 200; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal { background: #1a1f23; border: 1px solid var(--bd); border-radius: 12px; padding: 32px; width: 440px; max-width: calc(100vw - 48px); }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.modal-wk   { font-family: var(--sf); font-size: 20px; color: var(--ac); font-weight: 400; line-height: 1.2; }
.modal-close { background: none; border: none; color: #5a6370; font-size: 22px; cursor: pointer; padding: 0; line-height: 1; }
.modal-close:hover { color: #fff; }

/* View mode */
.note-display { font-family: var(--ss); font-size: 15px; color: #dcdcde; line-height: 1.65; margin: 0 0 12px; white-space: pre-wrap; }
.link-display { display: block; font-size: 14px; color: var(--ac); text-decoration: underline; margin-bottom: 24px; word-break: break-all; }
.link-display:hover { color: #f0cfa0; }

/* Edit mode */
.modal-lbl  { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: rgba(232,192,140,.65); font-weight: 600; margin-bottom: 7px; }
.modal-field { width: 100%; background: var(--bg); border: 1px solid var(--bd); border-radius: 6px; color: #dcdcde; font-family: var(--ss); padding: 11px 14px; outline: none; margin-bottom: 14px; }
.modal-field:focus { border-color: rgba(232,192,140,.45); }
.modal-field::placeholder { color: #384048; }
textarea.modal-field { font-size: 15px; line-height: 1.6; resize: vertical; min-height: 96px; }
input.modal-field    { font-size: 14px; margin-bottom: 24px; }

.modal-actions { display: flex; justify-content: flex-end; gap: 10px; align-items: center; }
.btn-cancel { background: transparent; border: 1px solid rgba(232,192,140,.2); color: #7a8390; padding: 9px 18px; border-radius: 6px; font-size: 14px; cursor: pointer; font-family: var(--ss); }
.btn-cancel:hover { border-color: rgba(232,192,140,.45); color: #fff; }
.btn-edit   { background: transparent; border: 1px solid rgba(232,192,140,.3); color: var(--ac); padding: 9px 18px; border-radius: 6px; font-size: 14px; cursor: pointer; font-family: var(--ss); }
.btn-edit:hover { border-color: var(--ac); }
.btn-done   { background: rgba(232,192,140,.12); border: none; color: var(--ac); padding: 9px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; font-family: var(--ss); }
.btn-done:hover { background: rgba(232,192,140,.2); }
.btn-save   { background: var(--ac); border: none; color: var(--bg); padding: 9px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--ss); }
.btn-save:hover { background: #f0cfa0; }
</style>
</head>
<body>
<div class="root"><div class="wrap">

<span class="eyebrow">Prototype v20260607·1821 · 52 × 10 · Fisheye hover · JS notes</span>
<h1 class="title">A decade, <em>one week at a time.</em></h1>
<p class="lead">520 cells spanning one decade. Hover any cell to magnify. Click the panel to annotate a week with a note and link.</p>

<div class="meta">
  <div class="meta-item"><span class="k">Span</span><span class="v">02026<small>–</small>02035</span></div>
  <div class="meta-item"><span class="k">Weeks</span><span class="v">520</span></div>
  <div class="meta-item"><span class="k">Notes</span><span class="v" id="noteCount">0<small>saved</small></span></div>
</div>

<div class="container">
  <div class="axis-x" id="axisX"></div>
  <div class="axis-y" id="axisY"></div>
  <div class="grid"   id="grid"></div>
</div>

</div></div>

<!-- Floating lens — single instance, JS-positioned above cursor -->
<div class="lens" id="lens" aria-live="polite">
  <div class="lens-head">
    <span class="lens-week" id="lensWeek"></span>
    <span class="lens-year" id="lensYear"></span>
  </div>
  <div class="lens-preview" id="lensPreview">
    <span class="lens-note-txt" id="lensNoteTxt"></span>
    <a  class="lens-link-txt" id="lensLinkTxt" target="_blank" rel="noopener"></a>
  </div>
  <button class="lens-btn" id="lensBtn" type="button">+ add a note</button>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-wk" id="modalWk"></span>
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    </div>

    <!-- View state: shown when an existing note is opened -->
    <div id="modeView" style="display:none">
      <p class="note-display" id="viewNote"></p>
      <a class="link-display" id="viewLink" target="_blank" rel="noopener" style="display:none"></a>
      <div class="modal-actions">
        <button class="btn-edit" id="btnEdit">Edit note</button>
        <button class="btn-done" id="btnDone">Close</button>
      </div>
    </div>

    <!-- Edit state: shown for new notes or after clicking "Edit note" -->
    <div id="modeEdit">
      <label class="modal-lbl" for="modalText">Note</label>
      <textarea class="modal-field" id="modalText" placeholder="What happened this week?"></textarea>
      <label class="modal-lbl" for="modalUrl">Link (optional)</label>
      <input  class="modal-field" id="modalUrl" type="url" placeholder="https://...">
      <div class="modal-actions">
        <button class="btn-cancel" id="modalCancel">Cancel</button>
        <button class="btn-save"   id="modalSave">Save note</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var YEARS = 10, WEEKS = 52, START_YEAR = 2026, STORE = 'lg-notes-v1';

  /* ── ISO week ─────────────────────────────────────────────────── */
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    var y = t.getUTCFullYear();
    var w = Math.ceil(((t - new Date(Date.UTC(y,0,1))) / 86400000 + 1) / 7);
    return { week: w, year: y };
  }
  var today = isoWeek(new Date());

  /* ── Axes ─────────────────────────────────────────────────────── */
  var axisX = document.getElementById('axisX');
  for (var wx = 1; wx <= WEEKS; wx++) {
    var sx = document.createElement('span');
    sx.textContent = (wx === 1 || wx % 5 === 0 || wx === WEEKS) ? wx : '';
    axisX.appendChild(sx);
  }
  var axisY = document.getElementById('axisY');
  for (var yx = 0; yx < YEARS; yx++) {
    var sy = document.createElement('span');
    sy.textContent = '0' + (START_YEAR + yx);
    axisY.appendChild(sy);
  }

  /* ── Grid ─────────────────────────────────────────────────────── */
  // One .row per year — sibling CSS selectors stay within each row,
  // preventing the fisheye effect from bleeding across year boundaries.
  var grid = document.getElementById('grid');
  for (var yi = 0; yi < YEARS; yi++) {
    var year = START_YEAR + yi;
    var row = document.createElement('div');
    row.className = 'row';
    for (var wi = 1; wi <= WEEKS; wi++) {
      var a = document.createElement('a');
      a.className = 'c';
      a.dataset.d = 'Week ' + wi + ', 0' + year;
      if (wi === today.week && year === today.year) a.classList.add('is-today');
      row.appendChild(a);
    }
    grid.appendChild(row);
  }

  /* ── localStorage ─────────────────────────────────────────────── */
  function loadNotes() {
    try { return JSON.parse(localStorage.getItem(STORE)) || {}; }
    catch (e) { return {}; }
  }
  function saveNotes(n) { localStorage.setItem(STORE, JSON.stringify(n)); }

  function refreshCells(notes) {
    var cells = document.querySelectorAll('.c');
    for (var i = 0; i < cells.length; i++) {
      var cell = cells[i];
      var note = notes[cell.dataset.d];
      var hasNote = !!(note && (note.text || note.url));
      var hasLink = !!(note && note.url);
      cell.classList.toggle('has-note', hasNote);
      cell.classList.toggle('has-link', hasLink);
    }
    var nc = document.getElementById('noteCount');
    if (nc) nc.innerHTML = Object.keys(notes).length + '<small>saved</small>';
  }

  /* ── Floating lens ────────────────────────────────────────────── */
  // The lens is a single fixed-position panel positioned by JS above
  // the cursor. pointer-events:none on the container means the cursor
  // always lands on the native .c element beneath it — smooth tracking
  // at any viewport size. Only lensBtn and lensLinkTxt are interactive.

  var lens        = document.getElementById('lens');
  var lensWeek    = document.getElementById('lensWeek');
  var lensYear    = document.getElementById('lensYear');
  var lensPreview = document.getElementById('lensPreview');
  var lensNoteTxt = document.getElementById('lensNoteTxt');
  var lensLinkTxt = document.getElementById('lensLinkTxt');
  var lensBtn     = document.getElementById('lensBtn');

  var currentCell = null;
  var LENS_GAP    = 14;  // px between cursor and bottom of lens

  function updateLens(cell) {
    var key   = cell.dataset.d;
    var parts = key.split(', ');
    lensWeek.textContent = parts[0];
    lensYear.textContent = parts[1];
    lensBtn.dataset.key  = key;

    var note = loadNotes()[key];
    if (note && (note.text || note.url)) {
      lensBtn.textContent = 'see note';
      lensPreview.classList.add('on');
      lensNoteTxt.textContent = note.text || '';
      if (note.url) {
        lensLinkTxt.href = note.url;
        lensLinkTxt.textContent = '↗ ' + note.url.replace(/^https?:\/\//, '').replace(/\/$/, '').split('/')[0];
        lensLinkTxt.style.display = '';
      } else {
        lensLinkTxt.style.display = 'none';
      }
    } else {
      lensBtn.textContent = '+ add a note';
      lensPreview.classList.remove('on');
    }
  }

  function positionLens(mx, my) {
    var lh = lens.offsetHeight;
    var lw = lens.offsetWidth;
    var top  = my - lh - LENS_GAP;
    var left = mx - lw / 2;
    // Clamp to viewport
    var maxLeft = window.innerWidth  - lw - 8;
    var maxTop  = window.innerHeight - lh - 8;
    left = Math.max(8, Math.min(left, maxLeft));
    top  = Math.max(8, Math.min(top,  maxTop));
    lens.style.left = left + 'px';
    lens.style.top  = top  + 'px';
  }

  // Track cursor — fires continuously so the lens follows the mouse.
  // Because lens has pointer-events:none, e.target is always the
  // underlying page element (the .c cell), giving accurate detection.
  document.addEventListener('mousemove', function (e) {
    var t = e.target;

    // If cursor is over an interactive lens element, keep the lens
    // stable — don't update or hide it.
    if (t === lensBtn || t === lensLinkTxt) return;

    // Find nearest .c ancestor
    var cell = t && t.closest ? t.closest('.c') : null;

    if (cell) {
      if (cell !== currentCell) {
        currentCell = cell;
        updateLens(cell);
      }
      positionLens(e.clientX, e.clientY);
      lens.classList.add('on');
    } else {
      lens.classList.remove('on');
      currentCell = null;
    }
  });

  /* ── Modal ────────────────────────────────────────────────────── */
  var modalBg   = document.getElementById('modalBg');
  var modalWk   = document.getElementById('modalWk');
  var modeView  = document.getElementById('modeView');
  var modeEdit  = document.getElementById('modeEdit');
  var viewNote  = document.getElementById('viewNote');
  var viewLink  = document.getElementById('viewLink');
  var modalText = document.getElementById('modalText');
  var modalUrl  = document.getElementById('modalUrl');
  var modalKey  = null;
  var hadNote   = false;  // was there already a note when modal opened?

  function openModal(key, startInEdit) {
    var notes = loadNotes();
    var note  = notes[key];
    modalKey  = key;
    hadNote   = !!(note && (note.text || note.url));
    modalWk.textContent = key;

    if (hadNote && !startInEdit) {
      showView(note);
    } else {
      showEdit(note || {});
    }
    modalBg.classList.add('open');
  }

  function showView(note) {
    modeView.style.display = '';
    modeEdit.style.display = 'none';
    viewNote.textContent = note.text || '';
    if (note.url) {
      viewLink.href = note.url;
      viewLink.textContent = note.url;
      viewLink.style.display = '';
    } else {
      viewLink.style.display = 'none';
    }
  }

  function showEdit(note) {
    modeView.style.display = 'none';
    modeEdit.style.display = '';
    modalText.value = note.text || '';
    modalUrl.value  = note.url  || '';
    setTimeout(function () { modalText.focus(); }, 40);
  }

  function closeModal() { modalBg.classList.remove('open'); modalKey = null; }

  function saveNote() {
    if (!modalKey) return;
    var text  = modalText.value.trim();
    var url   = modalUrl.value.trim();
    var notes = loadNotes();
    if (text || url) { notes[modalKey] = { text: text, url: url }; }
    else             { delete notes[modalKey]; }
    saveNotes(notes);
    refreshCells(notes);
    // Update lens if it's showing the same cell
    if (currentCell && currentCell.dataset.d === modalKey) updateLens(currentCell);
    closeModal();
  }

  // Lens button — opens modal (view or edit depending on note state)
  lensBtn.addEventListener('click', function () {
    if (lensBtn.dataset.key) openModal(lensBtn.dataset.key, false);
  });

  // Lens link click is handled natively by <a target="_blank">

  // Modal controls
  document.getElementById('btnEdit').addEventListener('click', function () {
    var notes = loadNotes();
    showEdit(notes[modalKey] || {});
  });
  document.getElementById('btnDone').addEventListener('click', closeModal);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', saveNote);
  document.getElementById('modalCancel').addEventListener('click', function () {
    // If there was an existing note, go back to view; otherwise close
    if (hadNote) {
      var notes = loadNotes();
      showView(notes[modalKey] || {});
    } else {
      closeModal();
    }
  });
  modalBg.addEventListener('click', function (e) { if (e.target === modalBg) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  // Init
  refreshCells(loadNotes());
}());
</script>
</body>
</html>
